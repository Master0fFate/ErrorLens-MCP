name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - 22.12.0
          - 24.x
          - 26.x
    steps:
      - name: Checkout (actions/checkout v6.1.0 pinned)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node (actions/setup-node v6.5.0 pinned)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, build, and unit tests
        run: npm run verify

      - name: Companion smoke (stdio)
        run: node dist/qa/companion-smoke.js rate-limit

      - name: Companion smoke (Streamable HTTP, both protocol eras)
        run: node dist/qa/companion-smoke.js rate-limit --transport http

      - name: Proxy write-timeout smoke (stdio)
        run: node dist/qa/proxy-smoke.js write-timeout

      - name: Proxy ambiguous-timeout smoke (stdio)
        run: node dist/qa/proxy-smoke.js publish-timeout

      - name: Proxy adapter-rule smoke (stdio)
        run: node dist/qa/proxy-smoke.js adapter-rule

      - name: Proxy write-timeout smoke (Streamable HTTP)
        run: node dist/qa/proxy-smoke.js write-timeout --transport http

      - name: Package dry run
        run: npm pack --dry-run
